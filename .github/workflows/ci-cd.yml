name: CI/CD

on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start scan
        uses: fjogeleit/http-request-action@v1
        with:
          url: "https://app.blacklock.io/api/scans/${{ secrets.SCAN_ID }}/start/"
          method: "POST"
          customHeaders: '{"Api-Key":"${{ secrets.API_KEY }}"}'
          timeout: 30000        # 5000 -> 30000
          retry: 2              # transient spike pe auto-retry
          retryWait: 3000
        env:
          SCAN_ID: ${{ secrets.SCAN_ID }}
